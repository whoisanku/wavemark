name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # the engine the pixel fixtures were recorded on (test/fixtures/pixels.json)
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build   # prints min+gzip size; warns above 3.5 KB
      - run: npm pack --dry-run --ignore-scripts   # dist/ was just built
