# Deploys the playground (demo/) to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions"
# (or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deployment at a time. Queued runs are skipped in favour of the newest,
# but an in-flight deployment is allowed to finish rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6   # fails fast, with a clear message, if Pages is not enabled
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build   # bundles demo/app.js from demo/app.ts + src/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v5
